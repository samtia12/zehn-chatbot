<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zehn</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23c9a86a'/%3E%3Cpath d='M5 5H19L8 18H19' stroke='%231a1a1a' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Ccircle cx='18' cy='18' r='2.3' fill='%231a1a1a'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23c9a86a'/%3E%3Cpath d='M5 5H19L8 18H19' stroke='%231a1a1a' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Ccircle cx='18' cy='18' r='2.3' fill='%231a1a1a'/%3E%3C/svg%3E">
<meta name="theme-color" content="#212121">
<style>
  :root{
    --bg: #212121;
    --bg-elevated: #2a2a2a;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text: #ececec;
    --text-dim: #a3a3a3;
    --text-faint: #6e6e6e;
    --bubble-user: #2f2f2f;
    --accent: #c9a86a;
    --accent-text: #1a1a1a;
    --danger: #f0605f;
    --radius-lg: 20px;
    --radius-md: 12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%; margin:0;}
  body{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display:flex;
    justify-content:center;
    overscroll-behavior: none;
  }
  .phone{
    width:100%;
    max-width: 480px;
    height:100vh;
    height: 100dvh;
    display:flex;
    flex-direction:column;
    background: var(--bg);
    overflow:hidden;
  }

  header{
    padding: 14px 18px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom: 1px solid var(--border);
    flex-shrink:0;
  }
  .avatar{
    width:30px;height:30px;border-radius:9px;
    background: var(--accent);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  header h1{ font-size:16px; margin:0; font-weight:600; letter-spacing:0.2px; }
  .status-wrap{ margin-inline-start:auto; display:flex; align-items:center; gap:6px; }
  .status-dot{ width:7px;height:7px;border-radius:50%; background: #3ac16a; flex-shrink:0; }
  .status-text{ font-size:11px; color: var(--text-faint); }

  #chat{
    flex:1;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling: touch;
    padding: 18px 16px 8px;
    display:flex;
    flex-direction:column;
    gap: 18px;
  }
  .row{ display:flex; }
  .row.user{ justify-content:flex-end; }
  .row.bot{ justify-content:flex-start; }

  .msg{
    max-width: 86%;
    font-size: 15px;
    line-height:1.6;
    white-space: pre-line;
    overflow-wrap: anywhere;
    animation: rise .22s ease-out;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:translateY(0);} }
  .row.user .msg{
    background: var(--bubble-user);
    padding: 10px 15px;
    border-radius: var(--radius-lg);
    border-bottom-right-radius: 5px;
  }
  .row.bot .msg{
    color: var(--text);
    padding: 2px 2px;
  }
  .msg img{ max-width:100%; border-radius:12px; margin-bottom:8px; display:block; }

  .typing{
    display:flex; gap:4px; align-items:center; padding: 4px 2px;
  }
  .typing span{ width:6px;height:6px;border-radius:50%; background: var(--text-faint); animation: blink 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay:.2s; }
  .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }

  .composer{
    padding: 10px 12px calc(14px + env(safe-area-inset-bottom));
    flex-shrink:0;
  }
  #imgPreviewBar{
    display:none;
    align-items:center;
    gap:8px;
    padding: 8px 10px;
    margin-bottom: 6px;
    background: var(--bg-elevated);
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
  }
  #imgPreviewBar.show{ display:flex; }
  #imgPreviewBar img{ width:36px; height:36px; object-fit:cover; border-radius:8px; }
  #imgPreviewBar span{ font-size:12px; color:var(--text-dim); flex:1; }
  #imgPreviewBar button{ background:none; border:none; color: var(--text-faint); font-size:16px; padding:4px 6px; }

  form#chatForm{
    display:flex;
    align-items:flex-end;
    gap:6px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-strong);
    border-radius: 26px;
    padding: 6px 6px 6px 14px;
  }
  #attachBtn{
    background: none; border:none; color:var(--text-dim);
    width:34px;height:34px; border-radius:50%; font-size:18px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  form#chatForm input[type=text]{
    flex:1; background: transparent; border:none;
    color:var(--text); padding: 8px 4px; font-size:15px; outline:none;
    min-width:0;
  }
  form#chatForm input[type=text]::placeholder{ color: var(--text-faint); }
  form#chatForm button[type=submit]{
    background: var(--text); color: var(--bg);
    border:none; width:34px;height:34px;border-radius:50%; font-size:15px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  form#chatForm button[type=submit]:disabled{ opacity:0.35; }

  .suggestions{
    display:flex; gap:8px; overflow-x:auto; padding: 0 2px 10px;
    -webkit-overflow-scrolling: touch;
  }
  .suggestions::-webkit-scrollbar{ display:none; }
  .suggestions button{
    flex-shrink:0;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size:12.5px;
    padding: 8px 14px;
    border-radius: 999px;
    white-space:nowrap;
  }

  #chat::-webkit-scrollbar{ width:0; }
</style>
</head>
<body>

<div class="phone">
  <header>
    <div class="avatar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 4H20L8 18H20" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="18.5" cy="18.5" r="2.5" fill="#1a1a1a"/>
      </svg>
    </div>
    <h1>Zehn</h1>
    <div class="status-wrap">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Online</span>
    </div>
  </header>

  <div id="chat"></div>

  <div class="composer">
    <div class="suggestions" id="suggestions">
      <button type="button" data-q="mujhy time table banao">📅 Time table</button>
      <button type="button" data-q="ek sunset ki tasveer banao">🎨 Tasveer banao</button>
      <button type="button" data-q="mujhy motivate karo">💪 Motivate karo</button>
      <button type="button" data-q="revision kese karu">📖 Revision tips</button>
      <button type="button" data-q="exam ka stress">😌 Exam stress</button>
    </div>
    <div id="imgPreviewBar">
      <img id="previewThumb" src="" alt="">
      <span>Tasveer attach hai</span>
      <button type="button" id="removeImg">✕</button>
    </div>
    <form id="chatForm">
      <button type="button" id="attachBtn">📷</button>
      <input id="userInput" type="text" placeholder="Message Zehn..." autocomplete="off" />
      <button type="submit" id="sendBtn">↑</button>
      <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none;">
    </form>
  </div>
</div>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('chatForm');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const attachBtn = document.getElementById('attachBtn');
  const fileInput = document.getElementById('fileInput');
  const imgPreviewBar = document.getElementById('imgPreviewBar');
  const previewThumb = document.getElementById('previewThumb');
  const removeImg = document.getElementById('removeImg');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const suggestions = document.getElementById('suggestions');

  let pendingImage = null;
  let history = [];

  const offlineRules = [
    { keywords: ["time table", "timetable", "schedule"], reply: "Ek simple study time table:\n\n6:00-7:00 — Revision (kal wala kaam)\n7:00-8:30 — Mushkil subject (jab dimagh fresh ho)\n8:30-9:00 — Break\n9:00-10:30 — Doosra subject\nShaam — Practice questions + notes banao\n\nHar 45-50 min baad 10 min break zaroor lein." },
    { keywords: ["motivate", "hosla", "mann nahi", "boring"], reply: "Ye samjhein: aap abhi jo mehnat kar rahe hain, wo future ka aap shukriya ada karega. Chota sa target set karein — sirf 25 min padhein, phir break. Aap kar sakte hain! 💪" },
    { keywords: ["revision", "yaad", "memorize"], reply: "Revision tips:\n1. Active recall — kitab band karke khud se sawal poochein\n2. Spaced repetition — aaj, phir 2 din baad dobara dekhein\n3. Apne alfaz mein likh kar samjhayein" },
    { keywords: ["stress", "pareshan", "dar", "anxiety"], reply: "Exam stress normal hai. Deep breath lein (4 sec andar, 4 sec bahar), syllabus chote parts mein tor dein, aur neend puri lein." },
    { keywords: ["salam", "assalam", "hi", "hello"], reply: "Wa alaikum assalam! Abhi internet nahi hai, is liye basic mode mein hoon. Net aane par pura AI wapas kaam karega." },
    { keywords: ["shukriya", "thanks"], reply: "Khushi hui madad kar ke!" },
  ];
  function getOfflineReply(userText){
    const text = (userText || '').toLowerCase();
    for(const rule of offlineRules){
      if(rule.keywords.some(k => text.includes(k))) return rule.reply;
    }
    return "Abhi internet connection nahi hai, is liye main sirf basic sawalon ka jawab de sakta hoon (time table, motivate karo, revision tips, exam stress). Net wapas aane par full AI se koi bhi sawal poochein.";
  }

  function updateConnectionStatus(){
    if(navigator.onLine){
      statusDot.style.background = '#3ac16a';
      statusText.textContent = 'Online';
    } else {
      statusDot.style.background = 'var(--danger)';
      statusText.textContent = 'Offline mode';
    }
  }
  window.addEventListener('online', () => { updateConnectionStatus(); addTextMessage('Internet wapas aa gaya — ab full AI se koi bhi sawal poochein.', 'bot'); });
  window.addEventListener('offline', () => { updateConnectionStatus(); addTextMessage('Internet chala gaya — ab basic offline mode mein hoon.', 'bot'); });
  updateConnectionStatus();

  function scrollDown(){ chat.scrollTop = chat.scrollHeight; }

  function addTextMessage(text, sender){
    const row = document.createElement('div');
    row.className = 'row ' + sender;
    const div = document.createElement('div');
    div.className = 'msg';
    div.textContent = text;
    row.appendChild(div);
    chat.appendChild(row);
    scrollDown();
    return div;
  }

  function addImageMessage(dataUrl, caption, sender){
    const row = document.createElement('div');
    row.className = 'row ' + sender;
    const div = document.createElement('div');
    div.className = 'msg';
    const img = document.createElement('img');
    img.src = dataUrl;
    div.appendChild(img);
    if(caption){
      const p = document.createElement('div');
      p.textContent = caption;
      div.appendChild(p);
    }
    row.appendChild(div);
    chat.appendChild(row);
    scrollDown();
  }

  function showTyping(){
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typingIndicator';
    row.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    chat.appendChild(row);
    scrollDown();
  }
  function hideTyping(){
    const el = document.getElementById('typingIndicator');
    if(el) el.remove();
  }

  attachBtn.addEventListener('click', () => {
    if(!navigator.onLine){
      addTextMessage('Tasveer ka jawab dene ke liye internet chahiye — abhi offline hain.', 'bot');
      return;
    }
    fileInput.click();
  });

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const base64 = dataUrl.split(',')[1];
      pendingImage = { base64, mediaType: file.type || 'image/jpeg', dataUrl };
      previewThumb.src = dataUrl;
      imgPreviewBar.classList.add('show');
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });

  removeImg.addEventListener('click', () => {
    pendingImage = null;
    imgPreviewBar.classList.remove('show');
  });

  async function callClaude(userText, imageData){
    const contentBlocks = [];
    if(imageData){
      contentBlocks.push({
        type: 'image',
        source: { type: 'base64', media_type: imageData.mediaType, data: imageData.base64 }
      });
    }
    contentBlocks.push({ type: 'text', text: userText || 'Is tasveer ke baray mein batayein.' });

    const messages = [...history, { role: 'user', content: contentBlocks }];

    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: messages })
    });

    const data = await response.json();
    if(!response.ok){
      throw new Error(data.error || ('API error: ' + response.status));
    }
    const textParts = data.content
      .filter(b => b.type === 'text')
      .map(b => b.text)
      .join('\n');
    return { reply: textParts || 'Maaf kijiye, jawab nahi mil saka.', raw: data.content };
  }

  const genTriggers = ["tasveer banao", "picture banao", "image banao", "pic banao", "banawao", "generate karo", "draw karo", "generate a picture", "generate an image", "create an image", "draw me", "make me a picture", "make an image"];
  function isImageGenRequest(text){
    const t = (text || '').toLowerCase();
    return genTriggers.some(k => t.includes(k));
  }
  function extractImagePrompt(text){
    let t = text;
    genTriggers.forEach(k => { t = t.replace(new RegExp(k, 'ig'), ''); });
    t = t.trim();
    return t || text;
  }
  function addGeneratedImage(promptText){
    const row = document.createElement('div');
    row.className = 'row bot';
    const div = document.createElement('div');
    div.className = 'msg';
    const img = document.createElement('img');
    const seed = Math.floor(Math.random() * 100000);
    img.src = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(promptText) + '?width=768&height=768&nologo=true&seed=' + seed;
    img.alt = promptText;
    img.loading = 'lazy';
    div.appendChild(img);
    const caption = document.createElement('div');
    caption.style.fontSize = '12px';
    caption.style.color = 'var(--text-faint)';
    caption.style.marginTop = '6px';
    caption.textContent = promptText;
    div.appendChild(caption);
    row.appendChild(div);
    chat.appendChild(row);
    scrollDown();
  }

  async function handleSend(text){
    if(!text && !pendingImage) return;
    sendBtn.disabled = true;
    suggestions.style.display = 'none';

    if(pendingImage){
      addImageMessage(pendingImage.dataUrl, text, 'user');
    } else {
      addTextMessage(text, 'user');
    }

    const imageForApi = pendingImage;
    input.value = '';
    imgPreviewBar.classList.remove('show');
    pendingImage = null;

    if(!navigator.onLine){
      setTimeout(() => { addTextMessage(getOfflineReply(text), 'bot'); }, 350);
      sendBtn.disabled = false;
      return;
    }

    if(!imageForApi && isImageGenRequest(text)){
      showTyping();
      const prompt = extractImagePrompt(text);
      setTimeout(() => {
        hideTyping();
        addGeneratedImage(prompt);
        sendBtn.disabled = false;
      }, 400);
      return;
    }

    showTyping();
    try{
      const { reply, raw } = await callClaude(text, imageForApi);
      hideTyping();
      addTextMessage(reply, 'bot');

      const userContent = [];
      if(imageForApi){
        userContent.push({ type:'image', source:{ type:'base64', media_type:imageForApi.mediaType, data:imageForApi.base64 } });
      }
      userContent.push({ type:'text', text: text || 'Is tasveer ke baray mein batayein.' });
      history.push({ role:'user', content:userContent });
      history.push({ role:'assistant', content: raw });
      if(history.length > 40) history = history.slice(-40);
    } catch(err){
      hideTyping();
      addTextMessage(getOfflineReply(text) + '\n\n(Network mein masla tha, is liye basic jawab diya.)', 'bot');
    } finally {
      sendBtn.disabled = false;
    }
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    handleSend(text);
  });

  suggestions.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => handleSend(btn.dataset.q));
  });

  addTextMessage('Hello dear! I\'m Zehn — your study assistant. Aap mujh se kisi bhi zaban mein baat kar sakte hain, main usi zaban mein jawab dunga.', 'bot');
</script>

</body>
</html>
